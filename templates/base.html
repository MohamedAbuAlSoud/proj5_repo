<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Semantic Course Recommender{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card {
            border-radius: 12px;
            transition: transform 0.2s ease-in-out;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .badge {
            font-weight: 500;
            padding: 0.5em 0.75em;
        }
        footer {
            margin-top: auto;
            background-color: #ffffff;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand text-warning" href="/recommendation">
                <i class="fa-solid fa-robot me-2"></i>AI Course Agent
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-navbar nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white active" href="/recommendation">
                            <i class="fa-solid fa-compass me-1"></i> Recommendations
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="/skills">
                            <i class="fa-solid fa-tags me-1"></i> Skills Catalog
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="/courses">
                            <i class="fa-solid fa-book-open me-1"></i> All Courses
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="py-3 text-center text-muted">
        <div class="container">
            <small>&copy; 2026 Semantic Agentic Recommendation Engine &bull; Powered by Flask, SentenceTransformers & PostgreSQL</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
